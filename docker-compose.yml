services:

  frontend:

    build:
      context: ./frontend

    container_name: transcendence-frontend

    working_dir: /app

    command: sh -c "npm run dev 2>&1 | tee /var/log/app/frontend.log"

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
      - app_logs:/var/log/app

    stdin_open: true
    tty: true
    init: true

    networks:
      - public-net
    
  backend:

    build:
      context: ./backend

    container_name: transcendence-backend

    depends_on:
      db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

    environment:
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}

    working_dir: /app

    command: sh -c "npm ci && npx prisma generate && npm run start:dev 2>&1 | tee /var/log/app/backend.log"

    ports:
      - "3001:3000"
    #for prisma db visualization in browser (maybe delete it at the end)
      - "5555:5555"

    volumes:
      - ./backend:/app:Z
      - /app/node_modules
      - app_logs:/var/log/app

    stdin_open: true
    tty: true
    init: true

    networks:
      - private-net

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  

  logs-init: # conteneur "jetable" : s'exécute une fois puis s'arrête
    image: docker.io/library/postgres:18-alpine
    command: sh -c "chmod 1777 /var/log/app" # ouvre le dossier en écriture pour tous, protégé par le sticky bit
    volumes:
      - app_logs:/var/log/app
  

  db:
    image: docker.io/library/postgres:18-alpine
    
    container_name: transcendence-db

    restart: on-failure
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    
    entrypoint: ["sh", "-c"]
    command:
      - >
        chmod 1777 /var/log/app &&
        exec docker-entrypoint.sh postgres
        -c logging_collector=on
        -c log_directory=/var/log/app
        -c log_filename=db.log
        -c log_file_mode=0644
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    volumes:
      - db_data:/var/lib/postgresql
      - app_logs:/var/log/app

    networks:
      - private-net

  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

    container_name: transcendence-elasticsearch

    environment:
      discovery.type: single-node         # une seule instance, pas de cluster
      xpack.security.enabled: "true"     # pas d authentification (réseau déjà isolé)
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"   # limite la RAM utilisée à 512 Mo
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      xpack.security.http.ssl.enabled: "false" # HTTP simple + mot de passe (réseau interne déjà isolé, pas de HTTPS pour éviter la gestion de certificats)


    
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    
    volumes:
      - es_data:/usr/share/elasticsearch/data     # garde les données entre rédemarrages
    
    networks:
      - private-net
  
  logstash:

    image: docker.elastic.co/logstash/logstash:8.15.0
    
    container_name: transcendence-logstash

    environment:
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}

    depends_on:
      elasticsearch:
        condition: service_healthy

    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - app_logs:/var/log/app:ro

    networks:
      - private-net
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0

    container_name: transcendence-kibana

    environment:
       ELASTICSEARCH_HOSTS: http://elasticsearch:9200        # où aller chercher les données
       ELASTICSEARCH_USERNAME: kibana_system
       ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
    
    ports:
      - "5601:5601"

    networks:
      - private-net
  
  
  vault:
    image: hashicorp/vault:1.17

    container_name: transcendence-vault

    cap_add:
      - IPC_LOCK # empêche les secrets d'être copiés sur le disque (swap) si la RAM est saturée
    
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    
    command: ["server", "-dev"]

    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    ports:
      - "8200:8200"
    
    networks:
      - private-net

  
  vault-init: # conteneur jetable : écrit les secrets dans Vault au démarrage, sans action manuelle
    image: hashicorp/vault:1.17

    container_name: transcendence-vault-init

    depends_on:
      vault:
        condition: service_healthy
    
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    
    volumes:
      - ./vault/entrypoint.sh:/entrypoint.sh:ro

    
    entrypoint: sh /entrypoint.sh

    networks:
      - private-net
  
  prometheus:
    image: docker.io/prom/prometheus:v3.11.2

    container_name: transcendence-prometheus

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:Z
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - private-net

  grafana:
    image: docker.io/grafana/grafana:13.2.1

    container_name: transcendence-grafana

    depends_on:
      - prometheus

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:Z
      - grafana_data:/var/lib/grafana

    ports:
      - "3002:3000"

    networks:
      - private-net

  alertmanager:
    image: docker.io/prom/alertmanager:v0.32.0

    container_name: transcendence-alertmanager

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:Z

    ports:
      - "9093:9093"

    networks:
      - private-net
  
  waf:
    image: owasp/modsecurity-crs:4.25-nginx-lts

    container_name: transcendence-waf

    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    
    environment:
      MODSEC_RULE_ENGINE: "On" # a passer en on après
    
    volumes:
      - ./waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:Z,ro

    ports:
      - "80:8080"
      - "443:8443"
    
    networks:
      - public-net
      - private-net


volumes:
  db_data:
  es_data:
  prometheus_data:
  grafana_data:
  app_logs: # volume partage pour les logs

networks:
  public-net:
  private-net:
    # internal: true - à remettre une fois Nginx (WAF) sera le seul point d'entrée public
    # et que le backend n auta plus besoin de son 'ports' direct. 

