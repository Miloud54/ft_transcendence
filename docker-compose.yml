services:

  frontend:

    build:
      context: ./frontend

    container_name: transcendence-frontend

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      UID: ${UID:-1000}
      GID: ${GID:-1000}

    working_dir: /app

    command: npm run dev

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    stdin_open: true
    tty: true
    init: true

  backend:

    build:
      context: ./backend

    container_name: transcendence-backend

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      UID: ${UID:-1000}
      GID: ${GID:-1000}

    working_dir: /app

    command: npm run start:dev

    ports:
      - "3001:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    stdin_open: true
    tty: true
    init: true