services:

  frontend:

    build:
      context: ./frontend

    container_name: transcendence-frontend

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      UID: ${UID:-1000}
      GID: ${GID:-1000}

    working_dir: /app

    command: npm run dev

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    stdin_open: true
    tty: true
    init: true

    networks:
      - public-net

  backend:

    build:
      context: ./backend

    container_name: transcendence-backend

    user: "${UID:-1000}:${GID:-1000}"

    depends_on:
      db:
        condition: service_healthy
    
    environment:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

    working_dir: /app

    command: npm run start:dev

    ports:
      - "3001:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    stdin_open: true
    tty: true
    init: true

    networks:
      - private-net
  

  db:
    image: postgres:18-alpine
    
    container_name: transcendance-db
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    volumes:
      - db_data:/var/lib/postgresql
    
    networks:
      - private-net
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

    container_name: transcendence-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    
    volumes:
      - es_data:/usr/share/elasticsearch/data
    
    networks:
      - private-net
  
  #vault:
    #image: hashicorp/vault:1.17

    #container_name: transcendance-vault

    #cap_add:
      #- IPC_LOCK # Ne pas faire du "swap" si la RAM est dépassée pour éviter une copie sur le disque dur
    
    #environment:
      
    

volumes:
  db_data:
  es_data:

networks:
  public-net:
  private-net:
    # internal: true - à remettre une fois Nginx (WAF) sera le seul point d'entrée public
    # et que le backend n auta plus besoin de son 'ports' direct. 

