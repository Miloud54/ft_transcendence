services:

  frontend:

    build:
      context: ./frontend

    container_name: transcendence-frontend

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      UID: ${UID:-1000}
      GID: ${GID:-1000}

    working_dir: /app

    command: npm run dev

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    stdin_open: true
    tty: true
    init: true

  backend:

    build:
      context: ./backend

    container_name: transcendence-backend

    user: "${UID:-1000}:${GID:-1000}"

    depends_on:
      db:
        condition: service_healthy
    
    environment:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

    working_dir: /app

    command: npm run start:dev

    ports:
      - "3001:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    stdin_open: true
    tty: true
    init: true
  

  db:
    image: postgres:18-alpine
    
    container_name: transcendance-db
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    volumes:
      - db_data:/var/lib/postgresql
    

volumes:
  db_data:

