input {
  file {
    path           => "/var/log/app/*.log"
    start_position => "beginning"
  }
}

# Filter applied to each log between reading it (input) and sending it to Elasticsearch (output):
# 1. adds a "service" field (frontend / backend / db), derived from the source file,
#    to filter and build per-service charts in Kibana;
# 2. masks secrets (accessToken, refreshToken, Bearer, password) by replacing them
#    with [REDACTED], so no token or password is readable in Kibana.

filter {
  if [log][file][path] =~ /frontend\.log$/ {
    mutate { add_field => { "service" => "frontend" } }
  } else if [log][file][path] =~ /backend\.log$/ {
    mutate { add_field => { "service" => "backend" } }
  } else if [log][file][path] =~ /db\.log$/ {
    mutate { add_field => { "service" => "db" } }
  } else if [log][file][path] =~ /waf\.log$/ {
    mutate { add_field => { "service" => "waf" } }
  }

  # The WAF healthcheck makes a request every few seconds: useless in Kibana
  if [service] == "waf" and [message] =~ /"healthcheck"/ {
    drop {}
  }

  mutate {
    gsub => [
      "message", "(accessToken|refreshToken)=[^&\s\"]+", "\1=[REDACTED]",
      "message", "Bearer [A-Za-z0-9._-]+", "Bearer [REDACTED]",
      "message", "(\"?password\"?\s*[:=]\s*\"?)[^\"&\s,}]+", "\1[REDACTED]"
    ]
  }
  
  # Splits the WAF lines (Nginx "combined" format + timing) into real fields:
  # response code, method, URL, IP, browser, processing time.
  # Placed AFTER the gsub: the URL tokens are already masked when it is parsed.
  if [service] == "waf" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG} rt=%{NUMBER:[waf][request_time]:float} urt=%{NOTSPACE:[waf][upstream_time]}" }
    }
  }


# Logstash 8 keeps a raw copy of the line in event.original:
  # we remove it, otherwise the secrets masked in "message" stay in clear text there.
  mutate { remove_field => ["[event][original]"] }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
    user => "logstash_writer"
    password => "${LOGSTASH_PASSWORD}"
  }
}
