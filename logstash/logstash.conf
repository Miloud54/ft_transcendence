input {
  file {
    path           => "/var/log/app/*.log"
    start_position => "beginning"
  }
}

# Filtre applique a chaque log entre la lecture (input) et l'envoi a Elasticsearch (output) :
# 1. ajoute un champ "service" (frontend / backend / db), deduit du fichier d'origine,
#    pour filtrer et faire des graphiques par service dans Kibana ;
# 2. masque les secrets (accessToken, refreshToken, Bearer, password) en les remplacant
#    par [REDACTED], pour qu'aucun token ni mot de passe ne soit lisible dans Kibana.

filter {
  if [log][file][path] =~ /frontend\.log$/ {
    mutate { add_field => { "service" => "frontend" } }
  } else if [log][file][path] =~ /backend\.log$/ {
    mutate { add_field => { "service" => "backend" } }
  } else if [log][file][path] =~ /db\.log$/ {
    mutate { add_field => { "service" => "db" } }
  }

  mutate {
    gsub => [
      "message", "(accessToken|refreshToken)=[^&\s]+", "\1=[REDACTED]",
      "message", "Bearer [A-Za-z0-9._-]+", "Bearer [REDACTED]",
      "message", "(\"?password\"?\s*[:=]\s*\"?)[^\"&\s,}]+", "\1[REDACTED]"
    ]
  }
# Logstash 8 garde une copie brute de la ligne dans event.original :
  # on la supprime, sinon les secrets masques dans "message" y restent en clair.
  mutate { remove_field => ["[event][original]"] }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
    user => "logstash_writer"
    password => "${LOGSTASH_PASSWORD}"
  }
}
