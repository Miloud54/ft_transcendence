# Next.js (Turbopack) nomme certains chunks statiques "[root-of-the-server]__xxx.css".
# Les crochets dans le chemin declenchent la regle 932130 (RCE / expression shell)
# -> faux positif qui bloque le CSS. Pour /_next/static/ uniquement, la regle 932130
# n'inspecte plus le chemin (REQUEST_FILENAME) mais reste active sur les params et cookies.
SecRule REQUEST_FILENAME "@beginsWith /_next/static/" \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=932130;REQUEST_FILENAME"

# L'API utilise PATCH/PUT/DELETE (changement de profil, mot de passe, avatar, etc.)
# mais OWASP CRS n'autorise par défaut que GET HEAD POST OPTIONS -> 403 sur toute requête PATCH.
SecAction \
    "id:1001,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# Grafana interroge Prometheus via /grafana/api/ds/query avec des expressions PromQL
# du type "sum(up)" -> libinjection (regle 942100) les confond avec un appel de
# fonction SQL et bloque la requete a tort. On desactive cette regle uniquement
# sur cet endpoint, sur le champ contenant l'expression de la requete.
SecRule REQUEST_URI "@beginsWith /grafana/api/ds/query" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=942100"